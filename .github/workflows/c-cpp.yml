name: Compilar XenonRecomp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo fuente con submodulos
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configurar CMake ignorando utilidades externas
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DXENON_TESTS=OFF -DXENON_SAMPLES=OFF -DXXHASH_BUILD_XXHSUM=OFF

    - name: Compilar ejecutable XenonRecomp
      run: cmake --build build --config Release --target XenonRecomp -- /p:StopOnFirstFailure=false

    - name: Subir ejecutable xenon-recomp.exe
      uses: actions/upload-artifact@v4
      with:
        name: xenon-recomp-windows
        path: |
          build/**/xenon-recomp.exe
          build/**/XenonRecomp.exe
