name: Compilar XenonRecomp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo fuente con submodulos
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configurar CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DXENON_TESTS=OFF -DXENON_SAMPLES=OFF

    - name: Compilar ejecutable con MSBuild
      run: cmake --build build --config Release -- /p:StopOnFirstFailure=false /v:m

    - name: Subir ejecutable xenon-recomp.exe
      uses: actions/upload-artifact@v4
      with:
        name: xenon-recomp-windows
        path: |
          build/**/*.exe
