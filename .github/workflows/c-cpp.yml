name: Compilar XenonRecomp Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo fuente con submodulos
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configurar CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DXENON_TESTS=OFF -DXENON_SAMPLES=OFF -DXXHASH_BUILD_XXHSUM=OFF

    - name: Compilar objetivo principal
      run: cmake --build build --config Release --target xenon-recomp

    - name: Buscar ejecutable
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Get-ChildItem -Path build -Recurse -Filter xenon-recomp.exe | Copy-Item -Destination dist\ -Force

    - name: Subir ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: xenon-recomp-windows
        path: dist/
